name: iOS build

on:
  workflow_dispatch:
    inputs:
      xtool_ipa:
        description: "尝试用 xtool 生成工程并打包未签名 IPA（较慢，可能失败）"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

jobs:
  # 用 Xcode 直接编译 SwiftPM 包，验证 iOS 目标可编译。
  ios-compile:
    name: iOS compile (xcodebuild)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build for iOS
        run: |
          xcodebuild \
            -scheme ETS100Tool \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

  # 用 xtool 生成 Xcode 工程并产出未签名 .ipa。
  # 注意：xtool 在无 Darwin SDK / 未登录 Apple 且无 TTY 的环境下可能长时间阻塞，
  # 因此该任务默认不执行，仅在手动触发并勾选时运行。
  unsigned-ipa:
    name: xtool unsigned IPA
    if: github.event_name == 'push' || inputs.xtool_ipa
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install xtool
        run: |
          curl -fsSL -o xtool.zip \
            https://github.com/xtool-org/xtool/releases/download/1.24.0/xtool.app.zip
          unzip -q xtool.zip
          sudo xattr -dr com.apple.quarantine xtool.app || true
          echo "$PWD/xtool.app/Contents/MacOS" >> "$GITHUB_PATH"

      - name: Check xtool CLI
        run: |
          python3 -c "import subprocess,sys; sys.exit(subprocess.run(['xtool','--version'], timeout=120).returncode)"

      - name: Generate Xcode project
        run: |
          python3 -c "import subprocess,sys; sys.exit(subprocess.run(['xtool','dev','generate-xcode-project'], timeout=900).returncode)"

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ETS100Tool.xcodeproj \
            -scheme ETS100Tool \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry ETS100Tool-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ETS100Tool-unsigned-ipa
          path: ETS100Tool-unsigned.ipa
          if-no-files-found: error
