name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build Archive (unsigned)
        run: |
          xcodebuild archive \
            -project ETS100Tool.xcodeproj \
            -scheme ETS100Tool \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./build/ETS100Tool.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "=== ERROR LINES ==="
            grep -i "error:" build.log | head -30 || true
            echo "=================="
            exit $exit_code
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ./build/ETS100Tool.xcarchive/Products/Applications/ETS100Tool.app Payload/
          zip -r ETS100Tool.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ETS100Tool.ipa
          path: ETS100Tool.ipa
          retention-days: 7
